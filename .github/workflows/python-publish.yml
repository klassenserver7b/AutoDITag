# This workflow builds Python distributions (sdist/wheel), Linux packages (.deb, .rpm, .pkg.tar.zst)
# via PyInstaller + nFPM, and a standalone Windows executable (.exe) via PyInstaller,
# then publishes them to GitHub Releases and PyPI.

name: Release Build and Publish

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  python-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pip install -r requirements.txt

      - name: Build release distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  linux-packages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: 'pip'

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone binary with PyInstaller
        run: pyinstaller --onefile --name autoditag auto_di_tag.py

      - name: Install nFPM
        uses: goreleaser/nfpm-action@v6
        with:
          version: latest

      - name: Determine version & build Linux packages
        run: |
          VERSION="0.0.0-dev"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${GITHUB_EVENT_RELEASE_TAG_NAME}" ]]; then
            VERSION="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          fi
          export VERSION
          export ARCH="amd64"

          mkdir -p packages
          nfpm package --config nfpm.yaml --packager deb --target packages/
          nfpm package --config nfpm.yaml --packager rpm --target packages/
          nfpm package --config nfpm.yaml --packager archlinux --target packages/
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: packages/

  # 3. Windows standalone executable (PyInstaller)
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: 'pip'

      - name: Install dependencies & PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable with PyInstaller
        run: pyinstaller --onefile --name autoditag auto_di_tag.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/autoditag.exe


  release-publish:
    runs-on: ubuntu-latest
    needs:
      - python-build
      - linux-packages
      - windows-build

    steps:

      - name: Retrieve Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: release-assets/

      - name: Retrieve Linux packages
        uses: actions/download-artifact@v8
        with:
          name: linux-packages
          path: release-assets/

      - name: Retrieve Windows executable
        uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: release-assets/

      - name: Calculate tag name
        id: tagname
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${GITHUB_EVENT_RELEASE_TAG_NAME}" ]]; then
            TAG="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          else
            TAG="dev"
          fi
          echo "val=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release-assets/*
          file_glob: true
          tag: ${{ steps.tagname.outputs.val }}
          overwrite: true

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - python-build
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: pypi
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      # url: https://pypi.org/p/YOURPROJECT
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: python-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
